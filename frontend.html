<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThreadCycle Local</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-800 font-sans">

    <nav class="bg-white border-b border-stone-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-emerald-800 rounded-lg flex items-center justify-center text-emerald-300 font-bold">TC</div>
                <span class="font-black text-xl text-emerald-900">ThreadCycle</span>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-8">
        <h2 class="text-2xl font-black mb-6">Latest Listings</h2>
        <div id="listings-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            <p id="loading-text" class="text-stone-500">Connecting to local database...</p>
        </div>
    </main>

    <script>
        const CAT_EMOJI = { "Tops":"👕", "Bottoms":"👖", "Jackets":"🧥", "Footwear":"👟" };
        const getEmoji = (c) => CAT_EMOJI[c] || "🏷️";
        const formatPrice = (p) => `R ${Number(p).toFixed(2)}`;

        async function loadListings() {
            try {
                // Fetch data from our local PHP API
                const response = await fetch('api/read.php');
                const result = await response.json();
                
                const container = document.getElementById('listings-container');
                container.innerHTML = ''; 

                if (!result.success) {
                    container.innerHTML = `<p class="text-red-500">Error: ${result.error}</p>`;
                    return;
                }

                if (result.data.length === 0) {
                    container.innerHTML = `<p class="text-stone-500">No items found in database.</p>`;
                    return;
                }

                // Build the UI for each listing
                result.data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-xl shadow-sm border border-stone-200 overflow-hidden";
                    card.innerHTML = `
                        <div class="h-32 flex items-center justify-center text-5xl bg-stone-50 border-b border-stone-100">
                            ${getEmoji(item.category)}
                        </div>
                        <div class="p-4">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-bold text-sm">${item.title}</h3>
                                <span class="text-emerald-800 font-bold text-sm whitespace-nowrap">${formatPrice(item.price)}</span>
                            </div>
                            <p class="text-xs text-stone-500 mb-3">${item.description}</p>
                            <div class="flex justify-between items-center mt-4">
                                <span class="text-xs font-semibold px-2 py-1 rounded bg-emerald-100 text-emerald-800">${item.item_condition}</span>
                                <span class="text-xs text-stone-400">Seller: ${item.seller_name}</span>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Fetch failed:", error);
                document.getElementById('loading-text').innerText = "Failed to connect to backend.";
            }
        }

        // Run when page loads
        document.addEventListener('DOMContentLoaded', loadListings);
    </script>
</body>
</html>
